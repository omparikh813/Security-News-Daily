# MalNews configuration. Validated against a strict schema on load (malnews/settings.py).

edition:
  launch_date: 2026-11-01        # edition 1
  utc_offset_hours: -8           # PST, fixed (FR-15)

collection:                      # FR-2, SR-6
  window_hours: 24
  timeout_seconds: 15
  retries: 2
  user_agent: "MalNewsBot/1.0 (+https://github.com/omparikh813/security-news-daily)"
  max_redirects: 5
  max_feed_bytes: 30000000       # CISA's all.xml is several MB
  max_response_bytes: 5000000    # articles and robots.txt
  max_article_chars: 20000

dedupe:                          # FR-4
  title_similarity: 85
  min_title_tokens: 4            # short titles never merge on similarity alone

ranking:                         # FR-6
  publisher_weight: 0.4
  priority_weight: 0.4
  impact_weight: 0.2
  publisher_cap: 5
  official_multiplier: 2
  news_of_the_day: 3
  impact_keywords:
    - outage
    - ransomware
    - breach
    - supply chain
    - critical infrastructure

priority:                        # FR-5
  cvss: 0.35
  epss: 0.35
  kev: 0.30

enrich:                          # FR-7 to FR-9
  nvd_url: https://services.nvd.nist.gov/rest/json/cves/2.0
  kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  epss_url: https://api.first.org/data/v1/epss
  nvd_interval_seconds: 0.7      # NVD allows 50 requests / 30 s with a key
  nvd_interval_no_key: 6.5       # and 5 requests / 30 s without one
  max_lookups_per_run: 80
  max_cves_per_story: 5          # shown in the PDF, highest priority first
  pending_days: 14               # FR-9: re-check "Score pending" CVEs this long

zero_day:                        # FR-10
  keywords:
    - zero-day
    - 0-day
    - exploited before a patch
    - no patch available

story_of_week:                   # FR-15, FR-16
  replace_ratio: 1.2             # a new story must score 20% higher
  history_days: 7
  records_per_day: 10
  max_text_chars: 3000

ai:                              # FR-11 to FR-14
  default_model: nvidia/nemotron-3.5-lightning:free
  allowed_models:
    - nvidia/nemotron-3.5-lightning:free
    - anthropic/claude-haiku-5.5
  endpoint: https://openrouter.ai/api/v1/chat/completions
  timeout_seconds: 60
  requests_per_minute: 20
  max_requests_per_run: 150
  max_input_chars: 6000
  max_output_tokens: 400
  max_output_tokens_extended: 700  # Story of the Week (FR-16)

layout:                          # FR-17
  max_words: 1150
  words_per_minute: 230
